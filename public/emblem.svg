<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" fill="none">
  <!-- Stylized State Emblem of India (Lion Capital of Ashoka) -->
  <g fill="#1e293b">
    <!-- Top Central Lion Head -->
    <path d="M60 14 C54 14 50 18 50 24 C50 29 53 33 56 36 L56 46 C52 48 48 52 48 57 C48 64 53 70 60 70 C67 70 72 64 72 57 C72 52 68 48 64 46 L64 36 C67 33 70 29 70 24 C70 18 66 14 60 14 Z"/>
    <!-- Left Lion Profile -->
    <path d="M42 22 C37 22 34 26 34 31 C34 36 37 40 40 43 L38 52 C34 54 30 58 30 63 C30 70 35 75 42 75 L45 75 L45 58 C43 54 41 49 41 43 C42 39 42 32 42 22 Z"/>
    <!-- Right Lion Profile -->
    <path d="M78 22 C83 22 86 26 86 31 C86 36 83 40 80 43 L82 52 C86 54 90 58 90 63 C90 70 85 75 78 75 L75 75 L75 58 C77 54 79 49 79 43 C78 39 78 32 78 22 Z"/>
    <!-- Mane details -->
    <path d="M54 48 C51 52 50 56 50 61 L70 61 C70 56 69 52 66 48 Z"/>
    
    <!-- Abacus Base / Platform -->
    <rect x="20" y="78" width="80" height="8" rx="2"/>
    
    <!-- Ashoka Chakra in Center of Abacus -->
    <circle cx="60" cy="98" r="12" stroke="#1e293b" stroke-width="2.5" fill="none"/>
    <circle cx="60" cy="98" r="3" fill="#1e293b"/>
    <!-- Chakra Spokes -->
    <line x1="60" y1="86" x2="60" y2="110" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="48" y1="98" x2="72" y2="98" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="51.5" y1="89.5" x2="68.5" y2="106.5" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="51.5" y1="106.5" x2="68.5" y2="89.5" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Bull on Right, Horse on Left silhouettes -->
    <path d="M26 94 C26 91 30 89 34 89 L38 95 L34 102 C30 102 26 99 26 94 Z"/>
    <path d="M94 94 C94 91 90 89 86 89 L82 95 L86 102 C90 102 94 99 94 94 Z"/>

    <!-- Bottom Pedestal -->
    <rect x="14" y="112" width="92" height="6" rx="1"/>
    <rect x="8" y="120" width="104" height="8" rx="2"/>
    <path d="M12 128 L108 128 L100 134 L20 134 Z"/>

    <!-- Satyameva Jayate Inscription in Devanagari -->
    <text x="60" y="152" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
  </g>
</svg>
